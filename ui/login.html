<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3ec" />
    <title>Sign in · Tavryn</title>
    <link rel="icon" href="/assets/tavryn-logo-480.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/ui/theme.css" />
    <link rel="stylesheet" href="/ui/styles.css" />
    <style>
      .signin { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
      .signin-wrap { width: 100%; max-width: 920px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
      .signin .logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 1.6rem; color: var(--ink); text-decoration: none; margin-bottom: 18px; }
      .signin .logo img { width: 28px; height: 28px; }
      .signin h1 { font-family: var(--serif); font-weight: 400; font-size: 2.2rem; line-height: 1.05; margin-bottom: 8px; }
      .signin form { display: grid; gap: 14px; margin-top: 18px; }
      .signin .button { width: 100%; }
      .signin .error { color: var(--red); font-size: 0.9rem; min-height: 1.4em; }
      .demo-list { display: grid; gap: 2px; margin-top: 12px; }
      .demo-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
      .demo-row .who { font-weight: 600; font-size: 0.92rem; }
      .demo-row .creds { font-family: var(--mono); font-size: 0.78rem; color: var(--muted); overflow-wrap: anywhere; }
      @media (max-width: 760px) { .signin-wrap { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main class="signin">
      <div class="signin-wrap">
        <section class="card">
          <a class="logo" href="/"><img src="/assets/tavryn-logo-480.png" alt="" />Tavryn</a>
          <h1>Sign in to your company</h1>
          <p class="page-sub">Each company signs in to its own workspace and sees only its own business.</p>
          <form id="signin">
            <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="username" required /></div>
            <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
            <p class="error" id="error" role="alert"></p>
            <button class="button button-primary" type="submit">Sign in</button>
          </form>
        </section>

        <section class="card" id="demoCard" hidden>
          <h2>Demo access</h2>
          <p class="hint">These companies are fictional. Pick one to fill in its sign-in, then sign in. To act as another company, sign out and sign in again.</p>
          <div class="demo-list" id="demoList"></div>
        </section>
      </div>
    </main>
    <script type="module">
      const $ = (id) => document.getElementById(id);
      const label = (account) => account.role === "operator" ? "Runs the network"
        : account.role.startsWith("financier") ? "Lender"
        : { supplier: "Supplier", buyer: "Buyer", auditor: "Auditor" }[account.role] || account.role;
      const escape = (value) => String(value).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[c]);

      fetch("/api/v1/auth/me").then((response) => { if (response.ok) location.replace("/app"); });

      fetch("/api/v1/auth/demo-accounts").then((response) => response.ok ? response.json() : { accounts: [] }).then(({ accounts }) => {
        if (!accounts?.length) return;
        $("demoCard").hidden = false;
        $("demoList").innerHTML = accounts.map((account, index) => `
          <div class="demo-row">
            <div><div class="who">${escape(account.name)} <span class="hint">· ${escape(label(account))}</span></div>
            <div class="creds">${escape(account.email)} / ${escape(account.password)}</div></div>
            <button class="button button-secondary" type="button" data-index="${index}">Use</button>
          </div>`).join("");
        $("demoList").addEventListener("click", (event) => {
          const button = event.target.closest("button[data-index]");
          if (!button) return;
          const account = accounts[Number(button.dataset.index)];
          $("email").value = account.email;
          $("password").value = account.password;
          $("password").focus();
        });
      });

      $("signin").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("error").textContent = "";
        const response = await fetch("/api/v1/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: $("email").value, password: $("password").value }),
        }).catch(() => undefined);
        if (response?.ok) { location.replace("/app"); return; }
        const payload = await response?.json().catch(() => ({}));
        $("error").textContent = response?.status === 429
          ? "Too many attempts. Please wait a minute."
          : payload?.error || "Can't reach Tavryn right now.";
      });
    </script>
  </body>
</html>
